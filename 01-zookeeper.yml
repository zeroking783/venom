apiVersion: apps/v1
kind: Deployment 
metadata: 
  name: zookeeper 
  labels: 
    app: zookeeper 
  namespace: kafka
spec: 
  replicas: 1
  selector:
    matchLabels:
      app: zookeeper
  template:
    metadata:
      labels:
        app: zookeeper
    spec:
      containers:
        - image: confluentinc/cp-zookeeper:latest
          imagePullPolicy: IfNotPresent
          name: zookeeper
          ports:
            - containerPort: 2181
          env: 
            - name: ZOOKEEPER_CLIENT_PORT
              value: "2181"
          
---
apiVersion: v1
kind: Service 
metadata: 
  name: zookeeper-service 
  labels:
    app: zookeeper-service
  namespace: kafka 
spec:
  type: ClusterIP
  ports:
    - port: 2181
  selector:
    app: zookeeper